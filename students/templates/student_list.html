<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fde2e4, #e2ece9, #dfe7fd);
            background-attachment: fixed;
            margin: 0;
            padding: 30px;
            min-height: 100vh;
            color: #4a4a68;
        }

        .container {
            max-width: 950px;
            margin: 40px auto;
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(150, 140, 190, 0.25);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            padding-bottom: 20px;
            margin-bottom: 25px;
            border-bottom: 2px dashed #d8c9ee;
        }

        h1 {
            margin: 0;
            font-size: 26px;
            color: #5b4b8a;
            letter-spacing: 0.5px;
        }

        .subtitle {
            margin: 6px 0 0 0;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #9b8bc4;
        }

        h2 {
            color: #5b4b8a;
            margin: 30px 0 15px 0;
            font-size: 20px;
        }

        .btn {
            display: inline-block;
            padding: 9px 20px;
            border-radius: 25px;
            text-decoration: none;
            color: #3d3566;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(150, 140, 190, 0.35);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-add {
            background-color: #b5ead7;
        }

        .btn-edit {
            background-color: #a9c9ff;
            padding: 7px 16px;
        }

        .btn-delete {
            background-color: #ffd6e0;
            padding: 7px 16px;
        }

        .btn-logout {
            background-color: #ffd6e0;
        }

        .btn-search {
            background-color: #cdb4f6;
        }

        .search-form {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }

        .search-form input {
            flex: 1;
            padding: 11px 18px;
            border: 1px solid #d8c9ee;
            border-radius: 25px;
            font-size: 14px;
            background-color: rgba(255, 255, 255, 0.8);
            color: #4a4a68;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-form input:focus {
            outline: none;
            border-color: #a9c9ff;
            box-shadow: 0 0 0 3px rgba(169, 201, 255, 0.4);
        }

        .table-wrap {
            overflow-x: auto;
            border-radius: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: rgba(255, 255, 255, 0.6);
        }

        th, td {
            padding: 13px 16px;
            text-align: left;
            border-bottom: 1px solid #ece4f7;
        }

        th {
            background-color: #cdb4f6;
            color: #3d3566;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        tr:hover td {
            background-color: #f3eefc;
        }

        .actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .actions form {
            margin: 0;
        }

        .empty {
            text-align: center;
            color: #9b8bc4;
            padding: 25px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 20px;
                margin: 10px auto;
            }

            .header {
                flex-direction: column;
            }

            .search-form {
                flex-direction: column;
                align-items: stretch;
            }

            .btn-search {
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div>
                <h1>Green Valley Academy</h1>
                <p class="subtitle">Student Management System</p>
            </div>
            <a href="{% url 'logout' %}" class="btn btn-logout">Logout</a>
        </div>

        <a href="{% url 'add_student' %}" class="btn btn-add">+ Add Student</a>

        <h2>Student List</h2>

        <form method="GET" class="search-form">
            <input
                type="text"
                name="search"
                placeholder="Search by name or course..."
                value="{{ query|default:'' }}"
            >
            <button type="submit" class="btn btn-search">Search</button>
        </form>

        <div class="table-wrap">
            <table>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Actions</th>
                </tr>

                {% for student in students %}
                <tr>
                    <td>{{ student.name }}</td>
                    <td>{{ student.age }}</td>
                    <td>{{ student.email }}</td>
                    <td>{{ student.course }}</td>

                    <td>
                        <div class="actions">
                            <a href="{% url 'update_student' student.id %}" class="btn btn-edit">Edit</a>

                            <form method="POST"
                                action="{% url 'delete_student' student.id %}"
                                onsubmit="return confirm('Are you sure you want to delete this student?');">

                                {% csrf_token %}
                                <button type="submit" class="btn btn-delete">Delete</button>

                            </form>
                        </div>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="5" class="empty">No students found.</td>
                </tr>
                {% endfor %}
            </table>
        </div>
    </div>

</body>
</html>
