<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fde2e4, #e2ece9, #dfe7fd);
            background-attachment: fixed;
            margin: 0;
            padding: 30px;
            min-height: 100vh;
            color: #4a4a68;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(150, 140, 190, 0.25);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            padding-bottom: 20px;
            margin-bottom: 25px;
            border-bottom: 2px dashed #d8c9ee;
        }

        h1 {
            margin: 0;
            font-size: 26px;
            color: #5b4b8a;
            letter-spacing: 0.5px;
        }

        .subtitle {
            margin: 6px 0 0 0;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #9b8bc4;
        }

        .stat-card {
            background: linear-gradient(135deg, #cdb4f6, #a9c9ff);
            color: #3d3566;
            text-align: center;
            padding: 35px 20px;
            border-radius: 18px;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(169, 158, 230, 0.4);
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
        }

        .stat-card h2 {
            margin: 0 0 10px 0;
            font-size: 15px;
            font-weight: normal;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.85;
        }

        .stat-number {
            font-size: 56px;
            font-weight: bold;
        }

        .btn {
            display: inline-block;
            padding: 11px 22px;
            border-radius: 25px;
            text-decoration: none;
            color: #3d3566;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(150, 140, 190, 0.35);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-view {
            background-color: #a9c9ff;
        }

        .btn-add {
            background-color: #b5ead7;
        }

        .btn-logout {
            background-color: #ffd6e0;
        }

        .actions {
            display: flex;
            gap: 12px;
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 22px;
                margin: 10px auto;
            }

            .header {
                flex-direction: column;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div>
                <h1>Green Valley Academy</h1>
                <p class="subtitle">Student Management Dashboard</p>
            </div>
            <a href="{% url 'logout' %}" class="btn btn-logout">Logout</a>
        </div>

        <div class="stat-card">
            <h2>Total Students</h2>
            <div class="stat-number">{{ total_students }}</div>
        </div>

        <div class="actions">
            <a href="{% url 'student_list' %}" class="btn btn-view">View Students</a>
            <a href="{% url 'add_student' %}" class="btn btn-add">+ Add Student</a>
        </div>
    </div>

</body>
</html>
