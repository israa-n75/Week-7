<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fde2e4, #e2ece9, #dfe7fd);
            background-attachment: fixed;
            margin: 0;
            min-height: 100vh;
            color: #4a4a68;
        }

        /* ---------- Navbar ---------- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 50px;
            background: linear-gradient(135deg, #cdb4f6, #a9c9ff, #b5ead7);
            box-shadow: 0 4px 16px rgba(150, 140, 190, 0.3);
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
            color: #3d3566;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 28px;
            align-items: center;
        }

        .nav-links a {
            color: #3d3566;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            padding: 6px 4px;
            border-bottom: 2px solid transparent;
            transition: border-color 0.2s;
        }

        .nav-links a:hover {
            border-bottom-color: #3d3566;
        }

        /* ---------- Hero ---------- */
        .page {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .hero {
            background: linear-gradient(135deg, #cdb4f6, #a9c9ff, #b5ead7);
            border-radius: 50px;
            padding: 70px 20px;
            box-shadow: 0 10px 30px rgba(150, 140, 190, 0.3);
        }

        .hero-card {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
            background: rgba(255, 255, 255, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 80px;
            padding: 50px 40px;
        }

        .school-name {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #6b5b95;
            margin-bottom: 10px;
        }

        .hero-card h1 {
            margin: 0 0 15px 0;
            font-size: 38px;
            color: #3d3566;
        }

        .hero-card p {
            margin: 0 0 30px 0;
            font-size: 17px;
            line-height: 1.6;
            color: #4a4a68;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            display: inline-block;
            padding: 14px 28px;
            border-radius: 30px;
            text-decoration: none;
            color: #3d3566;
            font-size: 16px;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.85);
            box-shadow: 0 4px 12px rgba(150, 140, 190, 0.25);
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(150, 140, 190, 0.4);
            background-color: #ffffff;
        }

        .btn:active {
            transform: scale(0.97);
        }

        /* ---------- Mobile ---------- */
        @media (max-width: 700px) {
            .navbar {
                flex-direction: column;
                gap: 12px;
                padding: 15px 20px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 14px;
            }

            .hero {
                padding: 30px 12px;
                border-radius: 40px;
            }

            .hero-card {
                padding: 30px 20px;
                border-radius: 30px;
            }

            .hero-card h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href=""{% url 'home' %}" " class="brand">🎓 Student Management</a>

        <div class="nav-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'student_list' %}">Students</a>
            <a href="{% url 'courses' %}">Courses</a>
            <a href="{% url 'logout' %}">Logout</a>
        </div>
    </nav>

    <div class="page">
        <div class="hero">
            <div class="hero-card">
                <div class="school-name">
                <h2>Green Valley Academy<h2></div>
                <br>
                <h1>Student Management System</h1>
                <br>
                <div class="buttons">
                    <a href="{% url 'student_list' %}" class="btn">📋 View Students</a>
                    <a href="{% url 'add_student' %}" class="btn">➕ Add Student</a>
                    <a href="{% url 'courses' %}" class="btn">📑 Courses</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
