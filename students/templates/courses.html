<!DOCTYPE html>
<html>
<head>
    <title>Courses</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fde2e4, #e2ece9, #dfe7fd);
            background-attachment: fixed;
            margin: 0;
            min-height: 100vh;
            color: #4a4a68;
        }

        /* ---------- Navbar ---------- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 50px;
            background: linear-gradient(135deg, #cdb4f6, #a9c9ff, #b5ead7);
            box-shadow: 0 4px 16px rgba(150, 140, 190, 0.3);
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
            color: #3d3566;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 28px;
            align-items: center;
        }

        .nav-links a {
            color: #3d3566;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            padding: 6px 4px;
            border-bottom: 2px solid transparent;
            transition: border-color 0.2s;
        }

        .nav-links a:hover {
            border-bottom-color: #3d3566;
        }

        /* ---------- Page ---------- */
        .container {
            max-width: 850px;
            margin: 40px auto;
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(150, 140, 190, 0.25);
        }

        .school-name {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #9b8bc4;
            margin-bottom: 6px;
        }

        .course-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding-bottom: 18px;
            margin-bottom: 25px;
            border-bottom: 2px dashed #d8c9ee;
        }

        .course-header h2 {
            margin: 0;
            font-size: 26px;
            color: #5b4b8a;
        }

        .add-btn {
            display: inline-block;
            padding: 10px 22px;
            border-radius: 25px;
            background-color: #b5ead7;
            color: #3d3566;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(150, 140, 190, 0.35);
        }

        .add-btn:active {
            transform: scale(0.97);
        }

        /* ---------- Table ---------- */
        .table-wrap {
            overflow-x: auto;
            border-radius: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: rgba(255, 255, 255, 0.6);
        }

        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #ece4f7;
        }

        th {
            background-color: #cdb4f6;
            color: #3d3566;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        tbody tr:hover td {
            background-color: #f3eefc;
        }

        td[colspan] {
            text-align: center;
            color: #9b8bc4;
            padding: 25px;
        }

        /* Edit link + Delete button */
        td a,
        td button {
            display: inline-block;
            padding: 7px 16px;
            border: none;
            border-radius: 25px;
            color: #3d3566;
            font-size: 14px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        td a {
            background-color: #a9c9ff;
            margin-right: 8px;
        }

        td button {
            background-color: #ffd6e0;
        }

        td a:hover,
        td button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(150, 140, 190, 0.35);
        }

        td a:active,
        td button:active {
            transform: scale(0.97);
        }

        /* ---------- Mobile ---------- */
        @media (max-width: 700px) {
            .navbar {
                flex-direction: column;
                gap: 12px;
                padding: 15px 20px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 14px;
            }

            .container {
                padding: 20px;
                margin: 15px;
            }

            .course-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar"> 
        <a href="{% url 'home' %}" class="brand">🎓Student Management</a> 
        <div class="nav-links"> 
            <a href="{% url 'home' %}">Home</a> 
            <a href="{% url 'student_list' %}">Students</a> 
            <a href="{% url 'courses' %}">Courses</a> 
            <a href="{% url 'logout' %}">Logout</a> 
        </div> 
    </nav> 
    <div class="container"> 
        <div class="school-name">Green Valley Academy</div> 
        <div class="course-header"> 
            <h2>Available Courses</h2> 
            <a href="{% url 'add_course' %}" class="add-btn"> 
                + Add Course 
            </a> 
        </div> 
        <div class="table-wrap"> 
            <table> 
                <thead> 
                    <tr> 
                        <th>ID</th> 
                        <th>Course Name</th> 
                        <th>Duration</th> 
                        <th>Actions</th> 
                    </tr> 
                </thead> 
                <tbody> 
                    {% for course in courses %} 
                    <tr> 
                        <td>{{ forloop.counter }}</td> 
                        <td>{{ course.course_name }}</td> 
                        <td>{{ course.duration }}</td> 
                        <td> 
                            <a href="{% url 'edit_course' course.id %}">Edit</a> 
                            <form method="POST" 
                                  action="{% url 'delete_course' course.id %}" 
                                  style="display:inline;"
                                  onsubmit="return confirm('Are you sure you want to delete this course?');"> 
                                {% csrf_token %} 
                                <button type="submit">Delete</button> 
                            </form> 
                        </td> 
                    </tr> 
                    {% empty %} 
                    <tr> 
                        <td colspan="4">No courses added yet</td> 
                    </tr> 
                    {% endfor %} 
                </tbody> 
                </tbody> 
            </table> 
        </div> 
    </div> 
</body> 
</html>
