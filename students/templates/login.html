<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fde2e4, #e2ece9, #dfe7fd);
            background-attachment: fixed;
            margin: 0;
            padding: 30px;
            color: #4a4a68;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(150, 140, 190, 0.25);
        }

        .school-name {
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #9b8bc4;
            margin-bottom: 6px;
        }

        h1 {
            margin: 0 0 25px 0;
            padding-bottom: 18px;
            border-bottom: 2px dashed #d8c9ee;
            color: #5b4b8a;
            font-size: 24px;
            text-align: center;
        }

        .error {
            background-color: #ffe3e8;
            color: #a14458;
            border: 1px solid #ffd0d9;
            padding: 10px 14px;
            border-radius: 12px;
            margin: 0 0 18px 0;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
            color: #6b5b95;
        }

        input {
            width: 100%;
            padding: 11px 18px;
            border: 1px solid #d8c9ee;
            border-radius: 25px;
            font-size: 14px;
            background-color: rgba(255, 255, 255, 0.8);
            color: #4a4a68;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:hover {
            border-color: #bfaee0;
        }

        input:focus {
            outline: none;
            border-color: #a9c9ff;
            box-shadow: 0 0 0 3px rgba(169, 201, 255, 0.4);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px 22px;
            border-radius: 25px;
            color: #3d3566;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            margin-top: 25px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(150, 140, 190, 0.35);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-login {
            background-color: #cdb4f6;
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="school-name">Green Valley Academy</div>
        <h1>Student Management Login</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Username:</label>
                <input type="text" name="username" required>
            </div>

            <div class="form-group">
                <label>Password:</label>
                <input type="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-login">Login</button>
        </form>
    </div>

</body>
</html>
